<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Built-in AI Chat</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #ffffff;
            --color-surface: #f7f7f8;
            --color-border: #e5e5e5;
            --color-text: #1a1a1a;
            --color-text-secondary: #6b6b6b;
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-user-bubble: #2563eb;
            --color-user-text: #ffffff;
            --color-ai-bubble: #f0f0f0;
            --color-ai-text: #1a1a1a;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font-family);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 820px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text);
        }

        .header-actions button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-bg);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .header-actions button:hover {
            background: var(--color-surface);
            color: var(--color-text);
            border-color: #ccc;
        }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            gap: 12px;
            color: var(--color-text-secondary);
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .welcome-message h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--color-text);
        }

        .welcome-message p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* Message bubbles */
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
        }

        .message.user .message-avatar {
            background: var(--color-user-bubble);
            border-color: var(--color-user-bubble);
            color: var(--color-user-text);
        }

        .message-content {
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .message-content {
            background: var(--color-user-bubble);
            color: var(--color-user-text);
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: var(--color-ai-bubble);
            color: var(--color-ai-text);
            border-bottom-left-radius: 4px;
        }

        /* Typing indicator */
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-text-secondary);
            animation: typing 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            30% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px 12px;
            border-top: 1px solid var(--color-border);
            background: var(--color-bg);
            flex-shrink: 0;
        }

        .input-container {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 8px 8px 8px 16px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .input-container:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        #message-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--font-family);
            font-size: 15px;
            line-height: 1.5;
            color: var(--color-text);
            resize: none;
            max-height: 150px;
            padding: 4px 0;
        }

        #message-input::placeholder {
            color: var(--color-text-secondary);
        }

        #send-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            background: var(--color-primary);
            color: #ffffff;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }

        #send-button:hover:not(:disabled) {
            background: var(--color-primary-hover);
        }

        #send-button:disabled {
            background: var(--color-border);
            color: var(--color-text-secondary);
            cursor: not-allowed;
        }

        .disclaimer {
            text-align: center;
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-top: 8px;
        }

        /* Error Toast */
        .error-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #dc2626;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: var(--shadow-md);
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #b0b0b0;
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="header">
            <h1>Built-in AI Chat</h1>
            <div class="header-actions">
                <button id="new-chat" title="New Chat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                </button>
            </div>
        </header>

        <main id="chat-messages" class="chat-messages">
            <div class="welcome-message">
                <div class="welcome-icon">💬</div>
                <h2>Welcome to Built-in AI Chat</h2>
                <p>Powered by Chrome's built-in Gemini Nano model.<br>Your conversations stay on your device.</p>
            </div>
        </main>

        <footer class="input-area">
            <div class="input-container">
                <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
                <button id="send-button" title="Send" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13" />
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" />
                    </svg>
                </button>
            </div>
            <p class="disclaimer">Gemini Nano can make mistakes. Verify important information.</p>
        </footer>
    </div>

    <div id="error-toast" class="error-toast" style="display: none;"></div>

    <script>
        const chatMessages = document.getElementById("chat-messages");
        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        const newChatButton = document.getElementById("new-chat");
        const errorToast = document.getElementById("error-toast");

        let session = null;
        let isGenerating = false;

        // Show error toast
        const showError = (message) => {
            errorToast.textContent = message;
            errorToast.style.display = "block";
            setTimeout(() => {
                errorToast.style.display = "none";
            }, 5000);
        };

        // Check if the Prompt API is supported
        const isPromptApiSupported = () => {
            return "LanguageModel" in self;
        };

        // Create a new session
        const createSession = async () => {
            if (!isPromptApiSupported()) {
                showError("The Prompt API is not supported in this browser. Please use Chrome with Built-in AI enabled.");
                return null;
            }

            const availability = await LanguageModel.availability();

            if (availability === "unavailable") {
                showError("Gemini Nano model is not available. Please check chrome://flags for Built-in AI settings.");
                return null;
            }

            const supportedLanguages = ["en", "es", "ja"];
            const browserLang = navigator.language?.split("-")[0] || "en";
            const outputLanguage = supportedLanguages.includes(browserLang) ? browserLang : "en";

            const newSession = await LanguageModel.create({
                expectedOutputs: [{ type: "text", languages: [outputLanguage] }],
                monitor(m) {
                    m.addEventListener("downloadprogress", (e) => {
                        console.log(`Model download: ${Math.floor(e.loaded * 100)}%`);
                    });
                },
            });

            return newSession;
        };

        // Clear welcome message
        const clearWelcome = () => {
            const welcome = chatMessages.querySelector(".welcome-message");
            if (welcome) {
                welcome.remove();
            }
        };

        // Add a message to the chat
        const addMessage = (role, content) => {
            clearWelcome();

            const messageEl = document.createElement("div");
            messageEl.classList.add("message", role);

            const avatarEl = document.createElement("div");
            avatarEl.classList.add("message-avatar");
            avatarEl.textContent = role === "user" ? "👤" : "✨";

            const contentEl = document.createElement("div");
            contentEl.classList.add("message-content");
            contentEl.textContent = content;

            messageEl.appendChild(avatarEl);
            messageEl.appendChild(contentEl);
            chatMessages.appendChild(messageEl);

            scrollToBottom();
            return contentEl;
        };

        // Add typing indicator
        const addTypingIndicator = () => {
            clearWelcome();

            const messageEl = document.createElement("div");
            messageEl.classList.add("message", "ai");
            messageEl.id = "typing-indicator";

            const avatarEl = document.createElement("div");
            avatarEl.classList.add("message-avatar");
            avatarEl.textContent = "✨";

            const contentEl = document.createElement("div");
            contentEl.classList.add("message-content");

            const indicator = document.createElement("div");
            indicator.classList.add("typing-indicator");
            indicator.innerHTML = "<span></span><span></span><span></span>";

            contentEl.appendChild(indicator);
            messageEl.appendChild(avatarEl);
            messageEl.appendChild(contentEl);
            chatMessages.appendChild(messageEl);

            scrollToBottom();
        };

        // Remove typing indicator
        const removeTypingIndicator = () => {
            const indicator = document.getElementById("typing-indicator");
            if (indicator) {
                indicator.remove();
            }
        };

        // Scroll to bottom of chat
        const scrollToBottom = () => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        };

        // Send message
        const sendMessage = async () => {
            const text = messageInput.value.trim();
            if (!text || isGenerating) return;

            // Add user message
            addMessage("user", text);
            messageInput.value = "";
            messageInput.style.height = "auto";
            updateSendButton();

            isGenerating = true;
            sendButton.disabled = true;

            // Show typing indicator
            addTypingIndicator();

            try {
                // Create session if needed
                if (!session) {
                    session = await createSession();
                    if (!session) {
                        removeTypingIndicator();
                        addMessage("ai", "Failed to initialize the AI model. Please check that Built-in AI is enabled in your browser.");
                        isGenerating = false;
                        updateSendButton();
                        return;
                    }
                }

                // Stream the response
                const stream = session.promptStreaming(text);
                removeTypingIndicator();

                const contentEl = addMessage("ai", "");
                let result = "";

                for await (const chunk of stream) {
                    result += chunk;
                    contentEl.textContent = result;
                    scrollToBottom();
                }
            } catch (error) {
                console.error("Error generating response:", error);
                removeTypingIndicator();
                addMessage("ai", "An error occurred while generating the response. Please try again.");
            } finally {
                isGenerating = false;
                updateSendButton();
            }
        };

        // Update send button state
        const updateSendButton = () => {
            sendButton.disabled = !messageInput.value.trim() || isGenerating;
        };

        // Auto-resize textarea
        const autoResize = () => {
            messageInput.style.height = "auto";
            messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + "px";
        };

        // Start a new chat
        const startNewChat = () => {
            if (session) {
                session.destroy();
                session = null;
            }
            isGenerating = false;

            chatMessages.innerHTML = `
        <div class="welcome-message">
          <div class="welcome-icon">💬</div>
          <h2>Welcome to Built-in AI Chat</h2>
          <p>Powered by Chrome's built-in Gemini Nano model.<br>Your conversations stay on your device.</p>
        </div>
      `;

            messageInput.value = "";
            messageInput.style.height = "auto";
            updateSendButton();
            messageInput.focus();
        };

        // Event listeners
        messageInput.addEventListener("input", () => {
            updateSendButton();
            autoResize();
        });

        messageInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener("click", sendMessage);
        newChatButton.addEventListener("click", startNewChat);

        // Focus input on load
        messageInput.focus();
    </script>
</body>

</html>
