<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Built-in AI Translator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <header class="header">
            <h1>Built-in AI Translator</h1>
        </header>

        <main class="translator-container">
            <div class="panel source-panel">
                <div class="panel-header">
                    <select id="source-language">
                        <option value="auto" selected>Detect Language</option>
                        <option value="en">English</option>
                        <option value="ja">Japanese</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ko">Korean</option>
                        <option value="zh">Chinese</option>
                        <option value="ru">Russian</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                        <option value="vi">Vietnamese</option>
                        <option value="nl">Dutch</option>
                        <option value="pl">Polish</option>
                        <option value="tr">Turkish</option>
                    </select>
                    <span id="detected-language" class="detected-badge" style="display: none;"></span>
                </div>
                <div class="textarea-container">
                    <textarea id="source-text" placeholder="Enter text to translate..."></textarea>
                    <div class="textarea-footer">
                        <span id="char-count" class="char-count">0</span>
                        <button id="clear-button" class="icon-button" title="Clear" style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="divider">
                <button id="swap-button" class="swap-button" title="Swap Languages">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M7 16l-4-4m0 0l4-4m-4 4h18" />
                        <path d="M17 8l4 4m0 0l-4 4m4-4H3" />
                    </svg>
                </button>
            </div>

            <div class="panel target-panel">
                <div class="panel-header">
                    <select id="target-language">
                        <option value="en">English</option>
                        <option value="ja" selected>Japanese</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ko">Korean</option>
                        <option value="zh">Chinese</option>
                        <option value="ru">Russian</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                        <option value="vi">Vietnamese</option>
                        <option value="nl">Dutch</option>
                        <option value="pl">Polish</option>
                        <option value="tr">Turkish</option>
                    </select>
                </div>
                <div class="textarea-container">
                    <textarea id="target-text" placeholder="Translation" readonly></textarea>
                    <div class="textarea-footer">
                        <div></div>
                        <button id="copy-button" class="icon-button" title="Copy Translation" style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <div id="status-bar" class="status-bar" style="display: none;">
            <div class="spinner"></div>
            <span id="status-text">Translating...</span>
        </div>
    </div>

    <div id="error-toast" class="error-toast" style="display: none;"></div>

    <script src="script.js"></script>
</body>

</html>
